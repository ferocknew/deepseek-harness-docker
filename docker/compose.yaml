services:
  dsh:
    image: ghcr.io/ferocknew/deepseek-harness-docker:${DSH_VERSION:-latest}
    container_name: dsh
    restart: unless-stopped
    environment:
      - DSH_HOME=/data/dsh
      - DSH_TELEMETRY_DISABLED=1
      - HTTPS_ACCESS_HOST=10.0.0.10
      - DSH_AUTH_USERNAME=admin
      - DSH_AUTH_PASSWORD=change-me
    volumes:
      # 相对 docker/ 目录：docker/data、docker/workspace
      - ./data:/data/dsh
      - ./workspace:/workspace
    ports:
      - "8443:8443"